patterns:
- id: weight_statistic_precomputation
  name: Cache weight-derived state only under an explicit lifecycle contract
  stage: algorithmic
  description: |
    A statistic or packed representation depending only on unchanged weights may
    be reused across calls when the workload permits preprocessing and caching.
  rationale: |
    Reuse can avoid repeated work, but adds initialization, storage and invalidation
    costs. Its benefit depends on the number of calls and the benchmark scope.
  pattern_before: |
    Each invocation recomputes a weight-derived quantity even though its complete
    set of dependencies remains unchanged across those invocations.
  pattern_after: |
    Identify every dependency and establish when it may change. Build derived
    state after weight loading and required device/dtype preparation, or lazily
    after those steps. Invalidate on weight mutation, replacement, checkpoint
    loading and relevant device, dtype or layout changes. A weight's _version
    alone is not a complete cache key: replacement can reuse a version value,
    and .data mutation can bypass the original tensor's version counter.
    Register a cache as a buffer when it should follow module conversions, but
    still recompute when converting a cached result is not equivalent to deriving
    it from the converted weights. Do not detach or reuse an autograd graph when
    gradients through the derived quantity are required. Test invalidation and
    repeated calls, not only the initial output. Include preprocessing costs or
    amortize them only as explicitly allowed by the benchmark contract.
  applies_to:
  - gemm_reduction
  - sum_scaling
  - weight_statistic

- id: sum_matmul_reorder
  name: Reduce before matmul when numerical reassociation is permitted
  stage: algorithmic
  description: |
    For A with shape [M, K] and B with shape [K, N], summing A @ B along
    dimension 1 is algebraically equivalent over real arithmetic to
    A @ B.sum(dim=1). The reduced B has shape [K] and the output has shape [M].
    If B is written as W.T for W of shape [N, K], reduce W along dimension 0.
  rationale: |
    The rewrite avoids materializing [M, N] and changes arithmetic complexity
    from O(M*N*K + M*N) to O(K*N + M*K). This is not a measured speedup:
    throughput, memory traffic and launch overhead still matter.
    Floating-point distributivity does not hold in general. Different summation
    order, intermediate rounding, overflow and cancellation can change outputs.
  pattern_before: |
    out = (A @ B).sum(dim=1)
  pattern_after: |
    out = A @ B.sum(dim=1)
  notes: |
    Use only when the workload permits reassociation and the result passes its
    numerical checks. For example, FP32 A=[[1, 1]] and
    B=[[100000000, 1], [-100000000, 1]] can give [2] before the rewrite and [0]
    afterward. Check accumulation and intermediate dtypes, representative value
    ranges, cancellation and supported shapes. Nonlinear operations between
    matmul and reduction generally prevent this identity from applying directly.
    Caching the reduced operand additionally requires the lifecycle conditions
    in weight_statistic_precomputation; it is not automatically allowed.
  applies_to:
  - gemm_row_reduction
  - linear_sum
  - matmul_reduce
