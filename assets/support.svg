<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Helvetica, Arial, sans-serif">
  <!-- Same diagram as support.tex. -->
  <defs>
    <style>
      .ok   { fill:#E4F2DF; stroke:#4A7F3A; stroke-width:1.4 }
      .part { fill:#FFF4DC; stroke:#B7862B; stroke-width:1.4 }
      .plan { fill:#FFFFFF; stroke:#888888; stroke-width:1.4; stroke-dasharray:5 4 }
      .band { fill:#F7F7F7; stroke:none }
      .t    { font-size:14px; fill:#1A1A1A; text-anchor:middle }
      .s    { font-size:11px; fill:#555555; text-anchor:middle }
      .l    { font-size:14px; font-weight:bold; fill:#1A1A1A }
      .ls   { font-size:11px; fill:#555555 }
      .h    { font-size:16px; font-weight:bold; fill:#1A1A1A }
    </style>
  </defs>
  <rect width="1000" height="540" fill="#FFFFFF"/>
  <text class="h" x="20" y="30">What Xe-Forge works with</text>

  <!-- Frameworks -->
  <rect class="band" x="12" y="46" width="976" height="64" rx="8"/>
  <text class="l" x="24" y="74">Frameworks</text><text class="ls" x="24" y="92">xe-forge run</text>
  <rect class="ok"   x="200" y="58" width="120" height="40" rx="5"/><text class="t" x="260" y="76">vLLM</text><text class="s" x="260" y="91">text</text>
  <rect class="ok"   x="330" y="58" width="120" height="40" rx="5"/><text class="t" x="390" y="76">SGLang</text><text class="s" x="390" y="91">text</text>
  <rect class="ok"   x="460" y="58" width="120" height="40" rx="5"/><text class="t" x="520" y="76">llama.cpp</text><text class="s" x="520" y="91">text</text>
  <rect class="ok"   x="590" y="58" width="120" height="40" rx="5"/><text class="t" x="650" y="76">OpenVINO</text><text class="s" x="650" y="91">text</text>
  <rect class="ok"   x="720" y="58" width="120" height="40" rx="5"/><text class="t" x="780" y="76">vLLM-Omni</text><text class="s" x="780" y="91">vision</text>
  <rect class="part" x="850" y="58" width="120" height="40" rx="5"/><text class="t" x="910" y="76">RLDX-1</text><text class="s" x="910" y="91">action</text>

  <!-- Engines -->
  <rect class="band" x="12" y="120" width="976" height="64" rx="8"/>
  <text class="l" x="24" y="148">Engines</text><text class="ls" x="24" y="166">who writes the trials</text>
  <rect class="ok" x="200" y="132" width="120" height="40" rx="5"/><text class="t" x="260" y="150">claude</text><text class="s" x="260" y="165">agent CLI</text>
  <rect class="ok" x="330" y="132" width="120" height="40" rx="5"/><text class="t" x="390" y="150">codex</text><text class="s" x="390" y="165">agent CLI</text>
  <rect class="ok" x="460" y="132" width="120" height="40" rx="5"/><text class="t" x="520" y="150">dspy</text><text class="s" x="520" y="165">LLM endpoint</text>
  <rect class="ok" x="590" y="132" width="120" height="40" rx="5"/><text class="t" x="650" y="150">dspy-agent</text><text class="s" x="650" y="165">LLM endpoint</text>

  <!-- Kernel languages -->
  <rect class="band" x="12" y="194" width="976" height="64" rx="8"/>
  <text class="l" x="24" y="222">Kernel languages</text><text class="ls" x="24" y="240">--dsl, or the call route</text>
  <rect class="ok" x="200" y="206" width="120" height="40" rx="5"/><text class="t" x="260" y="231">Triton</text>
  <rect class="ok" x="330" y="206" width="120" height="40" rx="5"/><text class="t" x="390" y="231">Gluon</text>
  <rect class="ok" x="460" y="206" width="120" height="40" rx="5"/><text class="t" x="520" y="231">SYCL</text>
  <rect class="ok" x="590" y="206" width="120" height="40" rx="5"/><text class="t" x="650" y="231">CUDA</text>
  <rect class="ok" x="720" y="206" width="120" height="40" rx="5"/><text class="t" x="780" y="231">OpenCL</text>
  <rect class="ok" x="850" y="206" width="120" height="40" rx="5"/><text class="t" x="910" y="224">library calls</text><text class="s" x="910" y="239">the call route</text>

  <!-- Measurement -->
  <rect class="band" x="12" y="268" width="976" height="64" rx="8"/>
  <text class="l" x="24" y="296">Measurement</text><text class="ls" x="24" y="314">code, not agents</text>
  <rect class="ok" x="200" y="280" width="185" height="40" rx="5"/><text class="t" x="292" y="298">benchmark</text><text class="s" x="292" y="313">correct, then timed</text>
  <rect class="ok" x="395" y="280" width="185" height="40" rx="5"/><text class="t" x="487" y="298">unitrace</text><text class="s" x="487" y="313">kernels, counters, stalls</text>
  <rect class="ok" x="590" y="280" width="185" height="40" rx="5"/><text class="t" x="682" y="298">VTune</text><text class="s" x="682" y="313">counters</text>
  <rect class="ok" x="785" y="280" width="185" height="40" rx="5"/><text class="t" x="877" y="298">torch profiler</text><text class="s" x="877" y="313">ops and their kernels</text>

  <!-- Devices -->
  <rect class="band" x="12" y="342" width="976" height="104" rx="8"/>
  <text class="l" x="24" y="370">Devices</text><text class="ls" x="24" y="388">--device</text>
  <rect class="ok"   x="200" y="354" width="185" height="80" rx="5"/>
  <text class="t" x="292" y="376">Intel GPU (xpu)</text>
  <text class="s" x="292" y="396">Triton, Gluon, SYCL, OpenCL</text>
  <text class="s" x="292" y="414">kernels and xe-forge run</text>
  <rect class="part" x="395" y="354" width="185" height="80" rx="5"/>
  <text class="t" x="487" y="376">NVIDIA GPU (cuda)</text>
  <text class="s" x="487" y="396">Triton, CUDA</text>
  <text class="s" x="487" y="414">kernels; no xe-forge run</text>
  <rect class="plan" x="590" y="354" width="185" height="80" rx="5"/>
  <text class="t" x="682" y="376">CPU</text>
  <text class="s" x="682" y="396">planned</text>
  <rect class="plan" x="785" y="354" width="185" height="80" rx="5"/>
  <text class="t" x="877" y="376">NPU</text>
  <text class="s" x="877" y="396">planned</text>

  <!-- legend -->
  <rect class="ok"   x="200" y="470" width="26" height="18" rx="3"/><text class="ls" x="234" y="484">works</text>
  <rect class="part" x="300" y="470" width="26" height="18" rx="3"/><text class="ls" x="334" y="484">partly: being brought up, or kernels only</text>
  <rect class="plan" x="600" y="470" width="26" height="18" rx="3"/><text class="ls" x="634" y="484">planned</text>
  <text class="ls" x="200" y="516">Nothing in the code names a framework: --framework is free text for the agents, so a new one needs no code.</text>
</svg>
